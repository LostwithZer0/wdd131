<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Submit a product review with ratings, useful features, installation date, and optional feedback for WDD 131.">
    <meta name="author" content="David Hostetter">

    <title>Product Review | WDD 131</title>

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <!-- Product Name -->
            <label for="product">
                Product Name <span class="required">*</span>
            </label>

            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <!-- Overall Rating -->
            <fieldset>
                <legend>
                    Overall Rating <span class="required">*</span>
                </legend>

                <div class="rating">
                    <label for="rating1">
                        <span>☆</span>
                        <input type="radio"
                            id="rating1"
                            name="rating"
                            value="1"
                            required>
                        1
                    </label>

                    <label for="rating2">
                        <span>☆☆</span>
                        <input type="radio"
                            id="rating2"
                            name="rating"
                            value="2"
                            required>
                        2
                    </label>

                    <label for="rating3">
                        <span>☆☆☆</span>
                        <input type="radio"
                            id="rating3"
                            name="rating"
                            value="3"
                            required>
                        3
                    </label>

                    <label for="rating4">
                        <span>☆☆☆☆</span>
                        <input type="radio"
                            id="rating4"
                            name="rating"
                            value="4"
                            required>
                        4
                    </label>

                    <label for="rating5">
                        <span>☆☆☆☆☆</span>
                        <input type="radio"
                            id="rating5"
                            name="rating"
                            value="5"
                            required>
                        5
                    </label>
                </div>
            </fieldset>

            <!-- Installation Date -->
            <label for="install-date">
                Date of Installation <span class="required">*</span>
            </label>

            <input type="date"
                id="install-date"
                name="install-date"
                required>

            <!-- Useful Features -->
            <fieldset>
                <legend>
                    Which features did you find useful?
                    <span class="optional">(Check all that apply)</span>
                </legend>

                <label for="durability">
                    <input type="checkbox"
                        id="durability"
                        name="features"
                        value="durability">
                    Durability
                </label>

                <label for="ease-of-use">
                    <input type="checkbox"
                        id="ease-of-use"
                        name="features"
                        value="ease-of-use">
                    Ease of Use
                </label>

                <label for="performance">
                    <input type="checkbox"
                        id="performance"
                        name="features"
                        value="performance">
                    Performance
                </label>

                <label for="design">
                    <input type="checkbox"
                        id="design"
                        name="features"
                        value="design">
                    Design
                </label>
            </fieldset>

            <!-- Written Review -->
            <label for="written-review">
                Written Review
                <span class="optional">(Optional)</span>
            </label>

            <textarea id="written-review"
                name="written-review"
                rows="6"></textarea>

            <!-- User Name -->
            <label for="username">
                Your Name
                <span class="optional">(Optional)</span>
            </label>

            <input type="text"
                id="username"
                name="username">

            <!-- Form Submission -->
            <input type="submit" value="Post My Review">

        </form>
    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span> | David Hostetter | Idaho
        </p>
        <p id="lastModified"></p>
    </footer>

</body>

</html>
