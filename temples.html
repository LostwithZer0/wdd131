<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A responsive temple picture album featuring temple images, captions, and mobile-friendly navigation.">
    <title>Temple Album</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">

    <script src="scripts/temples.js" defer></script>
</head>

<body>
    <header>
        <span>Temple Album</span>

        <button id="menu" aria-label="Open navigation menu"></button>

        <nav>
            <a href="#">Home</a>
            <a href="#">Old</a>
            <a href="#">New</a>
            <a href="#">Large</a>
            <a href="#">Small</a>
        </nav>
    </header>

    <main>
        <h1>Home</h1>

        <div class="temple-grid">
            <figure>
                <img src="images/slc-temple.jpg" alt="Temple">
                <figcaption>Salt Lake City, Utah Temple</figcaption>
            </figure>

            <figure>
                <img src="images/fortlauterdale-florida.jpg" alt="Temple">
                <figcaption>Fort Lauderdale, Florida Temple </figcaption>
            </figure>

            <figure>
                <img src="images/boston_temple_lds.jpg" alt="Temple">
                <figcaption>Boston, Massachusetts Temple</figcaption>
            </figure>

            <figure>
                <img src="images/idaho-falls-temple.jpg" alt="Temple">
                <figcaption>Idaho Falls, Idaho Temple</figcaption>
            </figure>

            <figure>
                <img src="images/mexico-city-mexico-temple.jpg" alt="Temple">
                <figcaption>Mexico City, Mexico Temple</figcaption>
            </figure>

            <figure>
                <img src="images/oakland-ca.jpg" alt="Temple">
                <figcaption>Oakland, California Temple</figcaption>
            </figure>

            <figure>
                <img src="images/rio-de-janeiro-brazil-temple.jpg" alt="Temple">
                <figcaption>Rio De Janeiro, Brazil Temple</figcaption>
            </figure>

            <figure>
                <img src="images/sandiego.jpg" alt="Temple">
                <figcaption>San Diego, California Temple</figcaption>
            </figure>

            <figure>
                <img src="images/tokyo-japan-temple.jpg" alt="Temple">
                <figcaption>Tokyo, Japan Temple</figcaption>
            </figure>
        </div>
    </main>
    <footer>
        <p>
            &copy; <span id="currentyear"></span> David Hostetter | Idaho
        </p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
